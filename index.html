<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mein Budget</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/logos/logo-1-coin-growth.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="brand"><img src="assets/logos/logo-1-coin-growth.png" alt="Mein Budget Logo"><div><h1>Mein <span>Budget</span></h1><small>PLANEN · SPAREN · ERREICHEN</small></div></div><button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">⚙</button></header>
<main id="view" aria-live="polite"></main>
<nav class="bottom-nav" aria-label="Hauptnavigation">
<button data-page="home" class="active"><b>⌂</b><span>Übersicht</span></button>
<button data-page="transactions"><b>⇄</b><span>Buchungen</span></button>
<button data-page="budget"><b>▥</b><span>Budget</span></button>
<button data-page="goals"><b>◎</b><span>Sparen</span></button>
<button data-page="more"><b>•••</b><span>Mehr</span></button>
</nav>
</div>
<dialog id="entryDialog"><form id="entryForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle">Buchung hinzufügen</h2><button type="button" class="icon-btn" id="closeDialog">✕</button></div><input type="hidden" id="entryId">
<label>Art<select id="entryType"><option value="expense">Ausgabe</option><option value="income">Einnahme</option><option value="saving">Sparen</option></select></label>
<label>Bezeichnung<input id="entryName" required maxlength="70" placeholder="z. B. Einkauf"></label>
<div class="form-row"><label>Betrag (€)<input id="entryAmount" required type="number" min="0.01" step="0.01" inputmode="decimal"></label><label>Datum<input id="entryDate" type="date" required></label></div>
<label>Kategorie<select id="entryCategory"><option>Wohnen</option><option>Lebensmittel</option><option>Auto</option><option>Freizeit</option><option>Versicherung</option><option>Gesundheit</option><option>Gehalt</option><option>Sparen</option><option>Sonstiges</option></select></label>
<div class="form-row"><button type="button" class="btn secondary hidden" id="deleteEntry">Eintrag löschen</button><button type="submit" class="btn primary">Speichern</button></div>
</form></dialog>
<dialog id="genericDialog"><form method="dialog" id="genericForm"><div class="dialog-head"><h2 id="genericTitle">Hinzufügen</h2><button type="button" class="icon-btn" id="closeGeneric">✕</button></div><div id="genericFields"></div><button class="btn primary full" type="submit">Speichern</button></form></dialog>
<script src="app.js"></script>
</body></html>
